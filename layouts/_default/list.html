{{ define "main" }}

<div class="page-header">
  <h1>{{ .Title }}</h1>
</div>

<div class="post-content">
  {{ .Content }}
</div>

{{ if .Pages }}
<ul class="note-list">
  {{ range .Pages }}
  <li class="note-item">
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="note-date">{{ .Date.Format "2 Jan 2006" }}</span>
  </li>
  {{ end }}
</ul>
{{ end }}

{{ end }}
