{{ define "main" }}

<div class="page-header">
  <h1>Notes</h1>
  <p>Thoughts on science, tools, and things I'm learning.</p>
</div>

{{ if .Pages }}
<ul class="note-list">
  {{ range .Pages }}
  <li class="note-item">
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="note-date">{{ .Date.Format "2 Jan 2006" }}</span>
  </li>
  {{ end }}
</ul>
{{ else }}
<p style="color: var(--text-muted);">No notes yet — check back soon.</p>
{{ end }}

{{ end }}
